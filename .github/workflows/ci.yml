name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test analytics rules
        run: python -m unittest discover -s services/analytics-service/tests
        env:
          PYTHONPATH: services/analytics-service
      - name: Test simulator behavior
        run: python -m unittest discover -s services/device-simulator/tests
        env:
          PYTHONPATH: services/device-simulator
      - name: Validate Compose
        run: docker compose --profile tools config --quiet
      - name: Build all images
        run: docker compose --profile tools build
