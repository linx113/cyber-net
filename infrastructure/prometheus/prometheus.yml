global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: device-service
    static_configs:
      - targets:
          - device-service-1:8000
          - device-service-2:8000
          - device-service-3:8000

  - job_name: command-service
    static_configs:
      - targets: ["command-service:8000"]

  - job_name: analytics-service
    static_configs:
      - targets: ["analytics-service:8000"]

  - job_name: alert-service
    static_configs:
      - targets: ["alert-service:8000"]

  - job_name: device-simulator
    static_configs:
      - targets: ["device-simulator:8000"]

  - job_name: logging-service
    static_configs:
      - targets: ["logging-service:8000"]

  - job_name: load-test-api
    static_configs:
      - targets: ["load-test-api:8000"]
