events {
    worker_connections 4096;
}

http {
    upstream device_services {
        least_conn;

        server device-service-1:8000 max_fails=1 fail_timeout=5s;
        server device-service-2:8000 max_fails=1 fail_timeout=5s;
        server device-service-3:8000 max_fails=1 fail_timeout=5s;
    }

    upstream command_service {
        server command-service:8000;
    }

    upstream alert_service {
        server alert-service:8000;
    }

    upstream load_test_service {
        server load-test-api:8000;
    }

    log_format cybernet
        '$remote_addr - [$time_local] '
        '"$request" $status '
        'upstream=$upstream_addr '
        'response_time=$request_time';

    access_log /var/log/nginx/access.log cybernet;

    server {
        listen 80;

        location = /api/devices {
            proxy_pass http://device_services/api/devices;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        location /api/commands {
            proxy_pass http://command_service/commands;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /api/alerts {
            proxy_pass http://alert_service/alerts;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /api/load-tests {
            proxy_pass http://load_test_service/load-tests;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }


        location /api/ {
            proxy_pass http://device_services;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        location = /healthz {
            return 200 "ok";
            add_header Content-Type text/plain;
        }

        location / {
            return 200 "CyberNet Load Balancer is running";
            add_header Content-Type text/plain;
        }
    }
}
